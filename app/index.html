<html lang="sv">

  <meta name="description" content="Hemmaträning från Järna Kung Fu & Kultur">
  <meta name="theme-color" content="#f3efe6">
  <!-- the saved theme (Inställningar → Utseende) before the first paint, so it never flashes Papper -->
  <script>try { const t = localStorage.getItem("jkk-theme"); if (["siden", "lotus", "wudang"].includes(t)) document.documentElement.dataset.theme = t; } catch {}</script>
  <meta property="og:title" content="Kung Fu Fitness – Järna Kung Fu & Kultur">
  <meta property="og:description" content="Hemmaträning från Järna Kung Fu & Kultur">
  <meta property="og:type" content="website">
  <!-- full address: link previews (iMessage, Facebook, Slack) fetch the image on their own and ignore relative paths -->

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Kung Fu Fitness – rund logga med tigerhuvud från Järna Kung Fu & Kultur">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- the ICO must not claim 16x16, or Chrome prefers it over the SVG, which
       is the only one that switches to light in dark mode -->

  <link rel="icon" href="icons/noun-tiger-favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/noun-tiger-apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
